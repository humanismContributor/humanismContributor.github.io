<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>humanismContributor · Projects</title>
  <meta name="description" content="A portfolio of coding projects by humanismContributor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #ffffff;
      --text: #1d2420;
      --muted: #5c665f;
      --line: #e3e0d6;
      --accent: #4d6b3c;
      --accent-soft: #e8eedf;
      --chip: #f0eee6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141814;
        --surface: #1c211c;
        --text: #e8ebe5;
        --muted: #a0aa9f;
        --line: #2e352e;
        --accent: #a9c98f;
        --accent-soft: #263022;
        --chip: #252b25;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, system-ui, sans-serif;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    header { padding: 72px 0 40px; }
    header img {
      width: 72px; height: 72px; border-radius: 50%;
      border: 1px solid var(--line);
    }
    h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
    h1 { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.15; margin: 20px 0 12px; }
    header p { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0; }
    .profile { margin-top: 20px; }
    .profile a { color: var(--accent); font-weight: 500; text-decoration: none; }
    .profile a:hover { text-decoration: underline; }
    .section-label {
      font-size: .8rem; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin: 0 0 16px; font-weight: 600;
    }
    .project {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .project h2 { font-size: 1.6rem; margin: 0 0 4px; }
    .tagline { color: var(--accent); font-weight: 500; margin: 0 0 16px; }
    .project ul { padding-left: 1.2em; margin: 16px 0; }
    .project li { margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; padding: 0; list-style: none; }
    .chips li {
      background: var(--chip); border-radius: 999px; padding: 3px 12px;
      font-size: .85rem; margin: 0;
    }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .links a {
      display: inline-block; padding: 9px 18px; border-radius: 8px;
      font-weight: 600; font-size: .95rem; text-decoration: none;
      border: 1px solid var(--accent); color: var(--accent);
    }
    .links a:first-child { background: var(--accent); color: var(--bg); }
    .links a:hover { opacity: .85; }
    .video { position: relative; aspect-ratio: 16 / 9; margin: 20px 0; border-radius: 10px; overflow: hidden; background: #000; }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .gallery {
      display: flex; gap: 12px; overflow-x: auto; margin: 20px 0;
      padding-bottom: 6px; scroll-snap-type: x mandatory;
    }
    .gallery a { flex: 0 0 auto; scroll-snap-align: start; }
    .gallery img {
      display: block; height: 220px; width: auto; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
    }
    @media (max-width: 520px) { .gallery img { height: 170px; } }
    .note {
      margin: 20px 0 0; padding: 12px 14px; border-radius: 8px;
      background: var(--accent-soft); color: var(--muted); font-size: .9rem;
    }
    footer { color: var(--muted); font-size: .85rem; padding: 32px 0 56px; }
    @media (max-width: 520px) { .project { padding: 20px; } header { padding-top: 48px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="https://avatars.githubusercontent.com/u/345180576?v=4" alt="">
      <h1>Projects by humanismContributor</h1>
      <p>Software I build, mostly tools that put public data to work on real-world problems.</p>
      <div class="profile"><a href="https://github.com/humanismContributor">GitHub profile →</a></div>
    </header>

    <main>
      <p class="section-label">Featured projects</p>
      <div id="projects"></div>
      <noscript><p>Turn on JavaScript to see the projects, or browse them on <a href="https://github.com/humanismContributor">GitHub</a>.</p></noscript>
    </main>

    <footer>Hosted on GitHub Pages.</footer>
  </div>

  <script src="projects.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    document.getElementById("projects").innerHTML = window.PROJECTS.map(p => `
      <article class="project">
        <h2>${esc(p.title)}</h2>
        <p class="tagline">${esc(p.tagline)}</p>
        <p>${esc(p.summary)}</p>
        ${p.youtube ? `<div class="video"><iframe src="https://www.youtube.com/embed/${esc(p.youtube)}" title="${esc(p.title)} presentation" loading="lazy" allow="encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>` : ""}
        <ul>${p.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
        ${p.images ? `<div class="gallery">${p.images.map(i => `<a href="${esc(i.src)}" target="_blank" rel="noopener"><img src="${esc(i.src)}" alt="${esc(i.alt)}" loading="lazy"></a>`).join("")}</div>` : ""}
        <ul class="chips">${p.stack.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
        <div class="links">${p.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      </article>`).join("");
  </script>
</body>
</html>
